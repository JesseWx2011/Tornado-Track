<!DOCTYPE html>
<html>

<head>
     
    <meta charset="utf-8" />
      <title>TornadoTrack</title>
     
    <meta name="viewport" content="width=device-width, initial-scale=1" />
     
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
     
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet" />
     
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700&display=swap" rel="stylesheet">
      <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #slider-container {
            position: absolute;
            left: 24px;
            bottom: 24px;
            background: rgba(30, 30, 30, 0.92);
            padding: 16px 20px;
            border-radius: 12px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
            font-family: 'Rubik', Arial, sans-serif;
        }

        #slider-label {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-right: 8px;
        }

        #slider {
            width: 320px;
            accent-color: #d32f2f;
            height: 6px;
            border-radius: 3px;
            margin: 0 8px;
        }

        #slider-value {
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            min-width: 40px;
            text-align: right;
            margin-left: 8px;
        }

        #play-btn,
        #pause-btn,
        #export-btn {
            background: #d32f2f;
            border: none;
            color: #fff;
            font-size: 18px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            margin-right: 4px;
            position: absolute;
        }

        #play-btn:hover,
        #pause-btn:hover,
        #export-btn:hover {
            background: #b71c1c;
        }

        #pause-btn {
            display: none;
        }

        .mapboxgl-ctrl,
        .mapboxgl-ctrl-attrib {
            display: none;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <button id="export-btn" title="Export as Video">&#x1F4E5;</button>
    <div id="slider-container" style="display:none;">
          <button id="play-btn" title="Play">&#9654;</button>
          <button id="pause-btn" title="Pause">&#10073;&#10073;</button>
          <span id="slider-label">Tornado Progress</span>
          <input type="range" id="slider" min="0" max="100" value="0" step="1">
          <span id="slider-value">0%</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    <script type="module">
        import { mapboxToken, tornadoSpeed, keyframes, points, showAnimationPlayer, tornadoIntensityColors, damageOverlay } from './config.js';

        mapboxgl.accessToken = mapboxToken;

        const markers = {};
        const sliderContainer = document.getElementById('slider-container');
        if (showAnimationPlayer) sliderContainer.style.display = 'flex';

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/hastytube/cmgciky0800dj01s21q1x2apo',
            center: keyframes[0].slice(0, 2),
            zoom: 12.9,
            pitch: 15,
            preserveDrawingBuffer: true,
            antialias: true,
            rastersaturation: 0.3,
        });

        let gl;
        let program;
        let verticesBuffer;
        let texture;

        const customLayer = {
            id: 'damage-reveal',
            type: 'custom',
            renderingMode: '3d',
            onAdd: function (map, glContext) {
                gl = glContext;
                const vertexShaderSource = `
            attribute vec2 a_pos;
            uniform mat4 u_matrix;
            varying vec2 v_texCoord;
            void main() {
                v_texCoord = a_pos * 0.5 + 0.5;
                gl_Position = u_matrix * vec4(a_pos.x, a_pos.y, 0.0, 1.0);
            }
        `;
                const fragmentShaderSource = `
            precision mediump float;
            uniform sampler2D u_image;
            varying vec2 v_texCoord;
            void main() {
                gl_FragColor = texture2D(u_image, v_texCoord);
            }
        `;

                program = gl.createProgram();
                const compileShader = (type, source) => {
                    const shader = gl.createShader(type);
                    gl.shaderSource(shader, source);
                    gl.compileShader(shader);
                    gl.attachShader(program, shader);
                    return shader;
                };
                compileShader(gl.VERTEX_SHADER, vertexShaderSource);
                compileShader(gl.FRAGMENT_SHADER, fragmentShaderSource);
                gl.linkProgram(program);

                verticesBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, verticesBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

                const a_pos = gl.getAttribLocation(program, 'a_pos');
                gl.enableVertexAttribArray(a_pos);
                gl.vertexAttribPointer(a_pos, 2, gl.FLOAT, false, 0, 0);

                texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

                const img = new Image();
                img.crossOrigin = '';
                img.onload = () => {
                    gl.bindTexture(gl.TEXTURE_2D, texture);
                    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
                    map.triggerRepaint();
                };
                img.src = damageOverlay.url;
            },
            render: function (glContext, matrix) {
                gl.useProgram(program);

                const u_matrix = gl.getUniformLocation(program, 'u_matrix');
                gl.uniformMatrix4fv(u_matrix, false, matrix);

                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.uniform1i(gl.getUniformLocation(program, 'u_image'), 0);

                gl.enable(gl.STENCIL_TEST);

                gl.stencilFunc(gl.EQUAL, 1, 0xFF);
                gl.stencilOp(gl.KEEP, gl.KEEP, gl.KEEP);

                gl.bindBuffer(gl.ARRAY_BUFFER, verticesBuffer);
                const a_pos = gl.getAttribLocation(program, 'a_pos');
                gl.enableVertexAttribArray(a_pos);
                gl.vertexAttribPointer(a_pos, 2, gl.FLOAT, false, 0, 0);

                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

                gl.disable(gl.STENCIL_TEST);

                map.triggerRepaint();
            },
        };

        function milesToMeters(miles) { return miles * 1609.34; }
        function metersToMiles(meters) { return meters / 1609.34; }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function interpolateCoords(a, b, t) { return a.slice(0, 3).some(isNaN) || b.slice(0, 3).some(isNaN) ? [0, 0, 0] : [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
        function haversineDistance([lon1, lat1], [lon2, lat2]) {
            const R = 6371000, toRad = Math.PI / 180, dLat = (lat2 - lat1) * toRad, dLon = (lon2 - lon1) * toRad;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon / 2) ** 2;
            return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        function createGeoJSONCircle(center, radiusInMeters, pointsNum = 64) {
            const [lon, lat] = center; const coords = [];
            const distanceX = radiusInMeters / 1000 / (111.320 * Math.cos(lat * Math.PI / 180));
            const distanceY = radiusInMeters / 1000 / 110.574;
            for (let i = 0; i < pointsNum; i++) {
                const theta = (i / pointsNum) * 2 * Math.PI;
                coords.push([lon + distanceX * Math.cos(theta), lat + distanceY * Math.sin(theta)]);
            }
            coords.push(coords[0]);
            return { type: 'FeatureCollection', features: [{ type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } }] };
        }

        function createTornadoSwathPolygon(kfs) {
            if (kfs.length < 2) return turf.polygon([]);

            const leftPoints = [], rightPoints = [];

            for (let i = 0; i < kfs.length; i++) {
                const [lon, lat, diameter] = kfs[i];
                const halfWidth = diameter / 2;

                let bearing;
                if (i === 0) {
                    bearing = turf.bearing(turf.point(kfs[i].slice(0, 2)), turf.point(kfs[i + 1].slice(0, 2)));
                } else if (i === kfs.length - 1) {
                    bearing = turf.bearing(turf.point(kfs[i - 1].slice(0, 2)), turf.point(kfs[i].slice(0, 2)));
                } else {
                    bearing = turf.bearing(turf.point(kfs[i].slice(0, 2)), turf.point(kfs[i + 1].slice(0, 2)));
                }

                if (i === kfs.length - 1) {
                    bearing = turf.bearing(turf.point(kfs[i - 1].slice(0, 2)), turf.point(kfs[i].slice(0, 2)));
                }

                const left = turf.destination([lon, lat], halfWidth, bearing - 90, { units: 'miles' });
                const right = turf.destination([lon, lat], halfWidth, bearing + 90, { units: 'miles' });
                leftPoints.push(left.geometry.coordinates);
                rightPoints.push(right.geometry.coordinates);
            }

            return turf.polygon([[...leftPoints, ...rightPoints.reverse(), leftPoints[0]]]);
        }


        map.on('load', () => {
            const initialRating = keyframes[0][3] || 'DEFAULT';
            const initialColor = tornadoIntensityColors[initialRating] || tornadoIntensityColors['DEFAULT'];

            map.addSource('damage-image', {
                type: 'image',
                url: damageOverlay.url,
                coordinates: damageOverlay.bounds
            });

            map.addSource('tornado-track-line', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: keyframes.map(k => k.slice(0, 2)) } } });
            map.addLayer({ id: 'tornado-track-layer', type: 'line', source: 'tornado-track-line', paint: { 'line-color': 'rgba(0,0,0,0)', 'line-width': 2, 'line-opacity': 0 } });

            map.addSource('tornado-head-line', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

            map.addLayer({
                id: 'tornado-head-layer',
                type: 'line',
                source: 'tornado-head-line',
                paint: {
                    'line-width': 4,
                    'line-color': [
                        'match',
                        ['get', 'rating'],
                        'EF0', tornadoIntensityColors['EF0'],
                        'EF1', tornadoIntensityColors['EF1'],
                        'EF2', tornadoIntensityColors['EF2'],
                        'EF3', tornadoIntensityColors['EF3'],
                        'EF4', tornadoIntensityColors['EF4'],
                        'EF5', tornadoIntensityColors['EF5'],
                        tornadoIntensityColors['DEFAULT']
                    ]
                }
            }, 'road-minor');

            map.addSource('tornado-circle', { type: 'geojson', data: createGeoJSONCircle(keyframes[0], [0]) });
            map.addLayer({
                id: 'tornado-circle-stencil',
                type: 'fill',
                source: 'tornado-circle',
                paint: { 'fill-color': initialColor, 'fill-opacity': 0.34 },
            }, 'road-minor');

            map.addLayer({ id: 'tornado-circle-border', type: 'line', source: 'tornado-circle', paint: { 'line-color': initialColor, 'line-width': 8 } }, 'road-minor');

            const swath = createTornadoSwathPolygon(keyframes);
            map.addSource('tornado-swath', { type: 'geojson', data: swath });
            map.addLayer({ id: 'tornado-swath-layer', type: 'fill', source: 'tornado-swath', paint: { 'fill-color': initialColor, 'fill-opacity': 0.3 } }, 'tornado-track-layer');

            map.addLayer(customLayer, 'tornado-circle-border');

            if (showAnimationPlayer) setSlider(0);
            else animateTornado(0, [keyframes[0]]);
        });

        function updateMarkers([lon, lat, diameter]) {
            points.forEach(point => {
                const distMiles = metersToMiles(haversineDistance([lon, lat], point.coordinates));
                const shouldShow = point.showWhen === 'any' || distMiles <= point.showWhen;
                let iconPath = point.icon || 'https://docs.mapbox.com/mapbox-gl-js/assets/custom_marker.png';
                if (point.type === 'fatality') iconPath = distMiles <= diameter / 2 ? './images/life-lost.svg' : './images/life-red.svg';

                if (shouldShow && !markers[point.name]) {
                    const el = document.createElement('div'); el.className = 'custom-marker'; el.style.opacity = '0'; el.style.transition = 'opacity 1s ease';
                    const img = document.createElement('img'); img.src = iconPath; img.style.width = '30px'; img.style.height = '40px'; img.style.display = 'block'; img.style.margin = '0 auto';
                    el.appendChild(img);
                    const label = document.createElement('div'); label.textContent = point.name; label.style.textAlign = 'center'; label.style.fontSize = '12px'; label.style.fontWeight = 'bold';
                    label.style.color = '#222'; label.style.textShadow = '1px 1px 2px white'; label.style.marginTop = '2px'; el.appendChild(label);
                    const marker = new mapboxgl.Marker(el).setLngLat(point.coordinates).addTo(map);
                    markers[point.name] = marker;
                    requestAnimationFrame(() => el.style.opacity = '1');
                } else if (!shouldShow && markers[point.name]) {
                    const marker = markers[point.name]; const el = marker.getElement(); el.style.opacity = '0';
                    setTimeout(() => { marker.remove(); delete markers[point.name] }, 1000);
                }
            });
        }

        function updateTornadoFrame([lon, lat, diameter], pathSoFar, rating) {
            const radius = milesToMeters(diameter) / 2;
            const color = tornadoIntensityColors[rating] || tornadoIntensityColors['DEFAULT'];

            map.getSource('tornado-circle').setData(createGeoJSONCircle([lon, lat], radius));
            map.setPaintProperty('tornado-circle-stencil', 'fill-color', color);
            map.setPaintProperty('tornado-circle-border', 'line-color', color);

            const fullHistory = pathSoFar.concat([
                [lon, lat, diameter, rating]
            ]);

            const lineFeatures = [];
            let currentSegment = [];
            let currentRating = 'DEFAULT';

            for (let i = 0; i < fullHistory.length - 1; i++) {
                const [lon_i, lat_i, diam_i, rate_i_raw] = fullHistory[i];
                const [lon_j, lat_j, diam_j, rate_j_raw] = fullHistory[i + 1];

                const segmentRating = rate_i_raw || 'DEFAULT';

                if (diam_i > 0 && diam_j > 0) {
                    if (currentSegment.length === 0) {
                        currentSegment.push([lon_i, lat_i]);
                        currentRating = segmentRating;
                    } else if (segmentRating !== currentRating) {
                        currentSegment.push([lon_i, lat_i]);
                        if (currentSegment.length > 1) {
                            lineFeatures.push({
                                type: 'Feature',
                                geometry: { type: 'LineString', coordinates: currentSegment },
                                properties: { rating: currentRating }
                            });
                        }
                        currentSegment = [[lon_i, lat_i]];
                        currentRating = segmentRating;
                    }
                    currentSegment.push([lon_j, lat_j]);
                } else {
                    if (currentSegment.length > 1) {
                        lineFeatures.push({
                            type: 'Feature',
                            geometry: { type: 'LineString', coordinates: currentSegment },
                            properties: { rating: currentRating }
                        });
                    }
                    currentSegment = [];
                }
            }

            if (currentSegment.length > 1) {
                lineFeatures.push({
                    type: 'Feature',
                    geometry: { type: 'LineString', coordinates: currentSegment },
                    properties: { rating: currentRating }
                });
            }

            map.getSource('tornado-head-line').setData({
                type: 'FeatureCollection',
                features: lineFeatures
            });

            const swathPath = fullHistory.map(k => k.slice(0, 3));
            const partialSwath = createTornadoSwathPolygon(swathPath);
            map.getSource('tornado-swath').setData(partialSwath);
            map.setPaintProperty('tornado-swath-layer', 'fill-color', color);

            updateMarkers([lon, lat, diameter]);
            map.easeTo({ center: [lon, lat], essential: true });
        }

        let isPlaying = false, animationFrame = null, currentIdx = 0;
        const slider = document.getElementById('slider'); const sliderValue = document.getElementById('slider-value');
        slider.max = keyframes.length - 1; slider.value = 0; sliderValue.textContent = '0%';

        function animateTornado(index, pathSoFar) {
            if (index >= keyframes.length - 1) return;
            const start = keyframes[index], end = keyframes[index + 1];
            const rating = start[3] || 'DEFAULT';
            const dist = haversineDistance(start, end), duration = dist / tornadoSpeed, startTime = performance.now();

            function step(timestamp) {
                const t = Math.min((timestamp - startTime) / duration, 1);
                const [lon, lat, diameter] = interpolateCoords(start, end, t);
                updateTornadoFrame([lon, lat, diameter], pathSoFar, rating);

                if (t < 1) animationFrame = requestAnimationFrame(step);
                else animateTornado(index + 1, [...pathSoFar, end]);
            }
            animationFrame = requestAnimationFrame(step);
        }

        function setSlider(idx) {
            currentIdx = idx;
            const [lon, lat, diameter, rating] = keyframes[idx];
            updateTornadoFrame([lon, lat, diameter], keyframes.slice(0, idx + 1), rating || 'DEFAULT');
            sliderValue.textContent = Math.round((idx / (keyframes.length - 1)) * 100) + '%';
        }

        function animateSlider() {
            if (!isPlaying || currentIdx >= keyframes.length - 1) { if (currentIdx >= keyframes.length - 1) pauseAnimation(); return; }
            const start = keyframes[currentIdx], end = keyframes[currentIdx + 1];
  const rating = start[3] || 'DEFAULT';
            const dist = haversineDistance(start, end), duration = dist / tornadoSpeed, startTime = performance.now();

            function step(timestamp) {
                if (!isPlaying) return;
                const t = Math.min((timestamp - startTime) / duration, 1);
                const [lon, lat, diameter] = interpolateCoords(start, end, t);

                const pathSoFar = keyframes.slice(0, currentIdx + 1);

                updateTornadoFrame(
                    [lon, lat, diameter],
                    pathSoFar,
                    rating
                );

                slider.value = currentIdx + t;
                sliderValue.textContent = Math.round(((currentIdx + t) / (keyframes.length - 1)) * 100) + '%';
                if (t < 1) animationFrame = requestAnimationFrame(step);
                else { currentIdx++; animateSlider(); }
            }
            animationFrame = requestAnimationFrame(step);
        }

        const playBtn = document.getElementById('play-btn'); const pauseBtn = document.getElementById('pause-btn');
        function playAnimation() { isPlaying = true; playBtn.style.display = 'none'; pauseBtn.style.display = 'inline-flex'; animateSlider(); }
        function pauseAnimation() { isPlaying = false; playBtn.style.display = 'inline-flex'; pauseBtn.style.display = 'none'; if (animationFrame) cancelAnimationFrame(animationFrame); if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); }
        playBtn.addEventListener('click', playAnimation); pauseBtn.addEventListener('click', pauseAnimation);
        slider.addEventListener('input', () => { setSlider(parseInt(slider.value, 10)); pauseAnimation(); });

        const exportBtn = document.getElementById('export-btn'); let mediaRecorder, recordedChunks = [];
        function startRecording() {
            currentIdx = 0; setSlider(0);
            const canvas = map.getCanvas(), stream = canvas.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            recordedChunks = [];
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data) };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'tornado-animation.webm'; a.click();
                URL.revokeObjectURL(url);
            };
            mediaRecorder.start(); playAnimation();
        }
        exportBtn.addEventListener('click', startRecording);

    </script>
</body>

</html>
